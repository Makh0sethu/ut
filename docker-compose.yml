services:
  # Production service build using Nginx static server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    env_file:
      - .env.example

  # Development service container with hot reloading
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Bind-mounted volumes on Windows/macOS don't reliably forward native FS
      # change events into the Linux container, so hot reload silently stops
      # working unless the watcher falls back to polling.
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env.example
