<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Inner Gradient -->
    <linearGradient id="zetdcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Text Path for Top Curved Text -->
    <path id="textArcTop" d="M 65,250 A 185,185 0 1,1 435,250" fill="none"/>
    <!-- Text Path for Bottom Curved Text -->
    <path id="textArcBottom" d="M 435,250 A 185,185 0 0,1 65,250" fill="none"/>

    <!-- Text Stroke/Outline Shadow filter -->
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer White Badge Base Ring -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#001F54" stroke-width="6" filter="url(#glow)"/>

  <!-- Outer Ring Dark Blue Border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#001F54" stroke-width="4"/>

  <!-- Inner Circle Grid Container -->
  <circle cx="250" cy="250" r="160" fill="url(#zetdcGrad)" stroke="#001F54" stroke-width="8"/>

  <!-- TRANSMISSION TOWER / PYLON GEOMETRIC WHITE WIRE GRID -->
  <g id="transmission-pylon" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Pylon Main Legs -->
    <line x1="160" y1="390" x2="230" y2="130"/>
    <line x1="340" y1="390" x2="270" y2="130"/>
    <!-- Center Mast -->
    <line x1="250" y1="390" x2="250" y2="100"/>

    <!-- Pylon Crossarms -->
    <line x1="130" y1="210" x2="370" y2="210"/>
    <line x1="150" y1="280" x2="350" y2="280"/>
    <line x1="180" y1="160" x2="320" y2="160"/>

    <!-- Diagonal Lattice Braces -->
    <line x1="160" y1="390" x2="250" y2="330"/>
    <line x1="340" y1="390" x2="250" y2="330"/>
    <line x1="175" y1="330" x2="250" y2="280"/>
    <line x1="325" y1="330" x2="250" y2="280"/>
    <line x1="190" y1="280" x2="250" y2="210"/>
    <line x1="310" y1="280" x2="250" y2="210"/>
    <line x1="205" y1="210" x2="250" y2="160"/>
    <line x1="295" y1="210" x2="250" y2="160"/>

    <!-- Radiating Power Lines -->
    <line x1="130" y1="210" x2="90" y2="250"/>
    <line x1="370" y1="210" x2="410" y2="250"/>
    <line x1="150" y1="280" x2="100" y2="330"/>
    <line x1="350" y1="280" x2="400" y2="330"/>
    <line x1="180" y1="160" x2="140" y2="120"/>
    <line x1="320" y1="160" x2="360" y2="120"/>
  </g>

  <!-- CENTER LOGO ACRONYM: ZETDC -->
  <g id="zetdc-text" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="78">
    <!-- White drop shadow / outline background -->
    <text x="250" y="278" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round">
      <tspan fill="#FFFFFF">ZET</tspan><tspan fill="#FFFFFF">DC</tspan>
    </text>
    <!-- Main Colored Foreground Text -->
    <text x="250" y="278">
      <tspan fill="#DC2626" stroke="#FFFFFF" stroke-width="2">ZET</tspan>
      <tspan fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2">DC</tspan>
    </text>
  </g>

  <!-- CURVED CIRCULAR TEXT AROUND RING -->
  <text fill="#001F54" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="25" letter-spacing="3">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ZIMBABWE ELECTRICITY
    </textPath>
  </text>

  <text fill="#001F54" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      TRANSMISSION &amp; DISTRIBUTION COMPANY
    </textPath>
  </text>
</svg>
