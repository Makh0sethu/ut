<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ZIMBABWE BIRD AND PEDESTAL AT TOP -->
  <g id="zimbabwe-bird">
    <!-- Pedestal Base / Chevron Wall -->
    <path d="M 210,180 L 290,180 L 280,140 L 220,140 Z" fill="#FACC15" stroke="#0A1172" stroke-width="6"/>
    <!-- Chevron Patterns on Pedestal -->
    <path d="M 225,180 L 235,160 L 245,180 M 245,180 L 255,160 L 265,180 M 265,180 L 275,160 M 225,160 L 235,145 L 245,160 M 245,160 L 255,145 L 265,160" fill="none" stroke="#0A1172" stroke-width="5" stroke-linejoin="round"/>

    <!-- Bird Silhouette facing left -->
    <!-- Tail, Body, Head, Beak -->
    <path d="M 280,140 
             C 340,145 360,110 320,80 
             C 290,60 270,50 250,15 
             C 245,5 235,0 225,5 
             C 215,10 215,20 220,30 
             C 225,40 210,50 200,60 
             C 190,70 190,85 200,95 
             C 205,100 215,105 220,115 
             C 225,125 210,135 220,140 Z" 
          fill="#FACC15" stroke="#0A1172" stroke-width="8" stroke-linejoin="round"/>
    <!-- Wing detail -->
    <path d="M 240,40 C 270,60 290,85 270,120 C 250,110 235,80 240,40 Z" fill="#FACC15" stroke="#0A1172" stroke-width="5"/>
    <!-- Bird Eye -->
    <circle cx="225" cy="22" r="4" fill="#0A1172"/>
  </g>

  <!-- RED HORNS AT SHIELD SHOULDER TOP LEFT AND RIGHT -->
  <path d="M 115,180 C 100,140 120,120 145,150 Z" fill="#DC2626" stroke="#0A1172" stroke-width="5"/>
  <path d="M 385,180 C 400,140 380,120 355,150 Z" fill="#DC2626" stroke="#0A1172" stroke-width="5"/>

  <!-- MAIN SHIELD CONTAINER -->
  <!-- Shield Outline Clip Path & Background -->
  <g id="shield">
    <clipPath id="shield-clip">
      <path d="M 120,160 
               Q 250,130 380,160 
               C 420,200 420,320 380,390 
               C 330,470 250,510 250,510 
               C 250,510 170,470 120,390 
               C 80,320 80,200 120,160 Z"/>
    </clipPath>

    <!-- Shield Inner Fill Sections -->
    <g clip-path="url(#shield-clip)">
      <!-- TOP FIELD: Cyan with radiating Sunburst Blue Rays -->
      <rect x="0" y="100" width="500" height="180" fill="#38BDF8"/>
      <!-- Radiating Blue Rays -->
      <polygon points="250,270 110,130 150,130" fill="#0A1172"/>
      <polygon points="250,270 190,130 220,130" fill="#0A1172"/>
      <polygon points="250,270 280,130 310,130" fill="#0A1172"/>
      <polygon points="250,270 350,130 390,130" fill="#0A1172"/>

      <!-- MIDDLE FIELD: Green Stripe -->
      <rect x="0" y="260" width="500" height="30" fill="#16A34A"/>

      <!-- BOTTOM LEFT FIELD: Yellow with Blue Wavy Lines (Water) -->
      <rect x="0" y="290" width="250" height="250" fill="#FACC15"/>
      <path d="M 50,320 Q 80,305 110,320 T 170,320 T 230,320" fill="none" stroke="#0A1172" stroke-width="8"/>
      <path d="M 50,350 Q 80,335 110,350 T 170,350 T 230,350" fill="none" stroke="#0A1172" stroke-width="8"/>
      <path d="M 50,380 Q 80,365 110,380 T 170,380 T 230,380" fill="none" stroke="#0A1172" stroke-width="8"/>
      <path d="M 50,410 Q 80,395 110,410 T 170,410 T 230,410" fill="none" stroke="#0A1172" stroke-width="8"/>
      <path d="M 50,440 Q 80,425 110,440 T 170,440 T 230,440" fill="none" stroke="#0A1172" stroke-width="8"/>

      <!-- BOTTOM RIGHT FIELD: Red with White Starburst and Torch -->
      <rect x="250" y="290" width="250" height="250" fill="#DC2626"/>
      <!-- White Starburst -->
      <path d="M 370,390 L 385,340 L 400,390 L 450,375 L 415,410 L 450,445 L 400,430 L 385,480 L 370,430 L 320,445 L 355,410 L 320,375 Z" fill="#FFFFFF"/>
      <!-- Torch Handle and Flame -->
      <path d="M 375,440 L 395,440 L 390,400 L 380,400 Z" fill="#FACC15" stroke="#0A1172" stroke-width="3"/>
      <path d="M 370,400 L 400,400 L 395,385 L 375,385 Z" fill="#FACC15" stroke="#0A1172" stroke-width="3"/>
      <!-- Flame -->
      <path d="M 385,385 C 370,365 380,350 385,340 C 395,355 400,365 385,385 Z" fill="#DC2626" stroke="#FACC15" stroke-width="2"/>

      <!-- Center Vertical Divider Line -->
      <line x1="250" y1="290" x2="250" y2="520" stroke="#0A1172" stroke-width="6"/>
    </g>

    <!-- Thick Outer Blue Border of Shield -->
    <path d="M 120,160 
             Q 250,130 380,160 
             C 420,200 420,320 380,390 
             C 330,470 250,510 250,510 
             C 250,510 170,470 120,390 
             C 80,320 80,200 120,160 Z" 
          fill="none" stroke="#0A1172" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- BOTTOM RIBBON BANNER -->
  <g id="ribbon">
    <!-- Ribbon background fold wings -->
    <path d="M 40,440 L 80,410 L 100,460 L 40,510 L 80,475 Z" fill="#0A1172" stroke="#0A1172" stroke-width="3"/>
    <path d="M 460,440 L 420,410 L 400,460 L 460,510 L 420,475 Z" fill="#0A1172" stroke="#0A1172" stroke-width="3"/>

    <!-- Main Yellow Banner Arc -->
    <path d="M 50,470 Q 250,580 450,470 Q 420,530 250,600 Q 80,530 50,470 Z" fill="#FACC15" stroke="#0A1172" stroke-width="8" stroke-linejoin="round"/>

    <!-- ZESA Text on Ribbon -->
    <text x="250" y="555" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="52" fill="#0A1172" letter-spacing="12">Z E S A</text>
  </g>
</svg>
